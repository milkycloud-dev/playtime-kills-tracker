# Статистика игроков: наигранное время и убитые монстры.
# Реквизиты подставляются при деплое, в репозитории их нет.
mysql:
  host: ''
  port: 3306
  database: ''
  username: ''
  password: ''

# Как часто данные из памяти уходят в базу. Чем реже, тем меньше запросов,
# но больше потерять при падении сервера.
flush-seconds: 60

# Журнал каждого убийства нужен только для разбора спорных случаев,
# на подсчёт топов не влияет. Записи старше этого срока чистятся сами.
# 0: не вести журнал.
kill-log-days: 30

# Защита от ферм. Ферму выдаёт место и неподвижность, а не вид моба, поэтому
# ничего не запрещаем. Просто не даём одной точке кормить таблицу.
anti-farm:
  # Больше этого числа убийств с одного чанка за час не засчитывается.
  # Ферма упирается в потолок, обычная игра его не замечает.
  chunk-kills-per-hour: 64
  # Если игрок столько минут не отходил дальше afk-radius, его убийства
  # не в счёт: значит молотит ферма, а не он.
  afk-minutes: 5
  afk-radius: 3


# Враждебность определяется категорией сущности в ядре, поэтому модовые мобы
# засчитываются сами. Списки ниже нужны, чтобы поправить отдельные случаи без
# пересборки. Имена такие же, как в таблице kill_types.

# Никогда не засчитывать. Здесь то, что можно штамповать бесконечно или
# получать по нескольку убийств с одного спавна.
never-monster:
  - minecraft:enderman         # весь Энд ими кишит, потолок чанка обходится бегом
  - minecraft:silverfish        # лезут из заражённых блоков без конца
  - minecraft:endermite         # появляется от каждой брошенной жемчужины
  - minecraft:slime             # делится при смерти: один спавн даёт до 21 убийства
  - minecraft:magma_cube        # то же деление
  - minecraft:zombified_piglin  # портальные фермы дают тысячи в час

# Засчитывать принудительно, если мод объявил своего моба мирным зря.
count-as-monster: []
